name: Nightly canary

# 04:17 UTC: an hour no neighbour occupies.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # One request per route, and a re-read of both robots.txt: a site that
      # changes its mind must break the build rather than pass unnoticed.
      - run: npm run test:live
        env:
          LEVER_LIVE: "1"
